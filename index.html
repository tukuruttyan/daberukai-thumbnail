<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作るっちゃん サムネメーカー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@800&family=Noto+Sans+JP:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mono">#</span> サムネメーカー</div>
    <button id="reset" class="ghost" type="button">初期状態に戻す</button>
  </header>

  <main class="layout">
    <section class="stage">
      <div id="ratios" class="ratios" role="group" aria-label="比率"></div>
      <div class="frame"><canvas id="preview" width="1920" height="1080" aria-label="サムネイルのプレビュー"></canvas></div>
      <div class="export">
        <div class="seg" role="group" aria-label="形式">
          <button type="button" data-format="png">PNG</button>
          <button type="button" data-format="jpeg">JPEG</button>
          <button type="button" data-format="webp">WebP</button>
        </div>
        <select data-key="size" aria-label="サイズ"></select>
        <button id="download" class="primary" type="button">ダウンロード</button>
      </div>
      <p id="ratio-hint" class="hint ratio-hint"></p>
      <p id="status" class="status mono"></p>
    </section>

    <section class="panel">
      <fieldset>
        <legend class="mono">TEXT</legend>
        <div class="row vol">
          <label>回数<input data-key="vol" type="text" inputmode="numeric" placeholder="なし"></label>
          <label>表記<select data-key="volStyle">
            <option value="hash">#03</option>
            <option value="vol">VOL.03</option>
            <option value="no">No.03</option>
            <option value="ep">EP.03</option>
            <option value="jp">第3回</option>
          </select></label>
          <label>場所<select data-key="volPos">
            <option value="sub">サブタイトルの後ろ</option>
            <option value="title">タイトルの上</option>
            <option value="inline">タイトルの前</option>
            <option value="info">DATE の表</option>
            <option value="corner">左下</option>
            <option value="big">背景に大きく</option>
          </select></label>
        </div>
        <label>タイトル<input data-key="title" type="text"></label>
        <label>サブタイトル<input data-key="sub" type="text"></label>
        <div class="row">
          <label>日付<input data-key="date" type="date"></label>
          <label>曜日<input id="day" data-key="day" type="text" placeholder="自動"></label>
        </div>
        <label>時間<input data-key="time" type="text"></label>
        <label>BY<input id="by" data-key="by" type="text" placeholder="名前から自動"></label>
        <p class="hint">回数は数字なら表記に合わせて整えます（「特別回」のような文字はそのまま）。空欄なら出しません。</p>
        <p class="hint">曜日と BY は空欄なら日付・登壇者の名前から自動で入ります。</p>
      </fieldset>

      <fieldset>
        <legend class="mono">SPEAKERS <span id="speaker-count" class="count"></span></legend>
        <div id="speakers" class="speakers"></div>
        <button id="add-speaker" class="ghost wide" type="button">＋ 登壇者を追加</button>
        <p class="hint">画像はカードにドラッグ＆ドロップでも差し替えられます。</p>
      </fieldset>

      <fieldset>
        <legend class="mono">STYLE</legend>
        <label class="check"><input data-key="fx" type="checkbox"> 色ズレ・グロー</label>
        <label class="check"><input data-key="showLogo" type="checkbox"> 作るっちゃんロゴ</label>
        <label class="check"><input data-key="muted" type="checkbox"> ミュート中の見た目（アーカイブ動画用）</label>
      </fieldset>
    </section>
  </main>

  <template id="speaker-tpl">
    <div class="sp">
      <div class="sp-head">
        <span class="sp-index mono"></span>
        <div class="sp-tools">
          <button type="button" class="icon sp-up" aria-label="上へ">↑</button>
          <button type="button" class="icon sp-down" aria-label="下へ">↓</button>
          <button type="button" class="icon sp-del" aria-label="削除">✕</button>
        </div>
      </div>
      <div class="sp-body">
        <label class="sp-thumb" title="画像を選ぶ">
          <input class="sp-file" type="file" accept="image/*">
          <span>画像を選ぶ</span>
        </label>
        <div class="sp-fields">
          <label>名前<input class="sp-name" type="text" placeholder="そーま"></label>
          <label>ラベル<input class="sp-label" type="text" placeholder="SO-MA"></label>
        </div>
      </div>
      <div class="sp-adjust">
        <label><span>ズーム <output class="sp-zoom-out mono"></output></span><input class="sp-zoom" type="range" min="50" max="250" step="1"></label>
        <label>横<input class="sp-ox" type="range" min="-50" max="50" step="1"></label>
        <label>縦<input class="sp-oy" type="range" min="-50" max="50" step="1"></label>
        <button type="button" class="ghost sp-reset">位置リセット</button>
      </div>
    </div>
  </template>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/assets.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
